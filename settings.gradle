pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'net.fabricmc.fabric-loom' version '1.17.20'
        id 'net.fabricmc.fabric-loom-remap' version '1.17.20'
    }
}

rootProject.name = 'fireglow'

file('versions').listFiles().findAll { it.isDirectory() && new File(it, 'build.gradle').exists() }.sort { it.name }.each {
    include it.name
    project(":${it.name}").projectDir = it
}
